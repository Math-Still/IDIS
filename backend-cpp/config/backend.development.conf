# Windows + Docker / Linux development baseline
mode=development
listen_host=0.0.0.0
listen_port=8000
web_root=apps/web/dist
device_adapter=simulated
device_registry_file=backend-cpp/config/devices.development.json
device_adapter_library=
device_adapter_options={}
os_adapter=posix
os_adapter_library=
os_adapter_options={}
allow_simulated_in_factory=false
worker_threads=4
non_realtime_queue_capacity=1024
feedback_queue_capacity=1024
realtime_queue_capacity=256
emergency_queue_capacity=32
acquisition_poll_ms=0
max_http_connections=128
http_request_timeout_ms=10000
max_ws_sessions=32
max_request_body_bytes=1048576
ws_outbound_queue_capacity=256
heartbeat_ms=5000
telemetry_publish_ms=1000
acquisition_stale_after_ms=3000
acquisition_offline_after_ms=10000
acquisition_failure_alarm_threshold=3
command_execution_timeout_ms=2000
command_feedback_timeout_ms=3000
command_feedback_poll_ms=100
command_ledger_enabled=true
command_ledger_directory=data/commands
command_ledger_max_records=100000
command_dashboard_limit=200
historian_enabled=true
historian_directory=data/historian
historian_max_records=200000
historian_retention_days=30
historian_backup_enabled=true
historian_backup_directory=data/backup/historian
historian_backup_interval_hours=24
historian_min_free_space_mb=512
platform_config_enabled=true
platform_config_directory=data/config
auth_enabled=false
auth_users_file=
audit_enabled=true
audit_directory=data/audit
audit_max_records=100000
allowed_origin=*
site_name=智慧工厂安全监测控制平台

# Intelligent assistant
agent_enabled=true
agent_provider=deepseek
agent_base_url=https://api.deepseek.com
agent_model=deepseek-chat
agent_api_key_env=DEEPSEEK_API_KEY
agent_timeout_ms=30000
agent_max_tokens=1400

# Mixed runtime domains
enable_realtime=true
require_realtime=false
realtime_priority=80
emergency_realtime_priority=90
realtime_cpu=-1
realtime_lock_memory=false

# Local simulated control path is enabled; production configuration remains separate.
enable_emergency_control=true
