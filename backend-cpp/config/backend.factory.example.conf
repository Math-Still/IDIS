# Native domestic-OS deployment template. Replace placeholders after target OS/API validation.
mode=factory
listen_host=0.0.0.0
listen_port=8000
web_root=apps/web/dist
device_adapter=plugin
device_registry_file=REPLACE_WITH_DEVICE_REGISTRY_JSON
device_adapter_library=REPLACE_WITH_DEVICE_ADAPTER_LIBRARY
device_adapter_options={}
os_adapter=plugin
os_adapter_library=REPLACE_WITH_OS_ADAPTER_LIBRARY
os_adapter_options={}
allow_simulated_in_factory=false
worker_threads=4
non_realtime_queue_capacity=1024
feedback_queue_capacity=1024
realtime_queue_capacity=256
emergency_queue_capacity=32
acquisition_poll_ms=0
max_http_connections=128
http_request_timeout_ms=10000
max_ws_sessions=32
max_request_body_bytes=1048576
ws_outbound_queue_capacity=256
heartbeat_ms=5000
telemetry_publish_ms=1000
acquisition_stale_after_ms=3000
acquisition_offline_after_ms=10000
acquisition_failure_alarm_threshold=3
command_execution_timeout_ms=2000
command_feedback_timeout_ms=REPLACE_WITH_VERIFIED_FEEDBACK_TIMEOUT_MS
command_feedback_poll_ms=REPLACE_WITH_VERIFIED_FEEDBACK_POLL_MS
command_ledger_enabled=true
command_ledger_directory=REPLACE_WITH_PERSISTENT_DATA_PATH/commands
command_ledger_max_records=100000
command_dashboard_limit=200
historian_enabled=true
historian_directory=REPLACE_WITH_PERSISTENT_DATA_PATH/historian
historian_max_records=200000
historian_retention_days=90
historian_backup_enabled=true
historian_backup_directory=REPLACE_WITH_PERSISTENT_DATA_PATH/backup/historian
historian_backup_interval_hours=24
historian_min_free_space_mb=1024
platform_config_enabled=true
platform_config_directory=data/config
auth_enabled=true
auth_users_file=REPLACE_WITH_PROTECTED_PATH/auth-users.json
audit_enabled=true
audit_directory=REPLACE_WITH_PERSISTENT_DATA_PATH/audit
audit_max_records=100000
allowed_origin=REPLACE_WITH_ALLOWED_ORIGIN
site_name=REPLACE_WITH_FACTORY_SITE

# Real-time domain. If deterministic execution is mandatory, keep require_realtime=true.
enable_realtime=true
require_realtime=true
realtime_priority=80
emergency_realtime_priority=90
realtime_cpu=REPLACE_WITH_CPU_ID
realtime_lock_memory=true

# Do not enable until the target device adapter and safety boundary are reviewed on site.
enable_emergency_control=false
